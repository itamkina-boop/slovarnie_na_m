<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Словарный Сугроб</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .stats {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            border: 3px solid #4CAF50;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 18px;
        }
        
        .stat-value {
            color: #FFD700;
            font-weight: bold;
        }
        
        .level-badge {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        #wordDisplay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            text-align: center;
            min-height: 60px;
            letter-spacing: 2px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 
                2px 2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                -2px -2px 0 #000,
                2px 0px 0 #000,
                0px 2px 0 #000,
                -2px 0px 0 #000,
                0px -2px 0 #000;
            z-index: 200;
            display: none;
            pointer-events: none;
        }
        
        .word-char {
            display: inline-block;
            margin: 0 5px;
            position: relative;
        }
        
        .word-char::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: -8px;
            height: 5px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            opacity: 0.8;
        }
        
        .missing-char {
            color: #2196F3;
            animation: pulse 1.5s infinite;
            text-decoration: underline;
            text-decoration-thickness: 4px;
            text-underline-offset: 10px;
        }
        
        .correct-char {
            color: #4CAF50;
            text-shadow: 
                2px 2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                -2px -2px 0 #000,
                2px 0px 0 #000,
                0px 2px 0 #000,
                -2px 0px 0 #000,
                0px -2px 0 #000,
                0 0 15px rgba(76, 175, 80, 0.8);
        }
        
        .wrong-char {
            color: #FF5252;
            text-shadow: 
                2px 2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                -2px -2px 0 #000,
                2px 0px 0 #000,
                0px 2px 0 #000,
                -2px 0px 0 #000,
                0px -2px 0 #000,
                0 0 15px rgba(255, 82, 82, 0.8);
        }
        
        #feedback {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            text-align: center;
            min-height: 40px;
            z-index: 201;
            transition: all 0.3s;
            display: none;
            pointer-events: none;
            text-shadow: 3px 3px 0 #000;
        }
        
        .correct { 
            color: #4CAF50; 
            animation: float 0.5s ease-in-out;
        }
        
        .wrong { 
            color: #FF5252; 
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-5px); }
            75% { transform: translate(-50%, -50%) translateX(5px); }
        }
        
        #celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .celebration-text {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #000;
            animation: float 2s ease-in-out infinite;
        }
        
        .celebration-subtext {
            font-size: 24px;
            text-align: center;
            margin-bottom: 40px;
            color: #4CAF50;
            max-width: 80%;
            line-height: 1.5;
        }
        
        #nextLevelBtn, #restartBtn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
            border: 3px solid white;
            border-radius: 25px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            min-width: 250px;
            text-align: center;
        }
        
        #nextLevelBtn:hover, #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
        }
        
        #nextLevelBtn {
            background: linear-gradient(45deg, #FF4081, #7B1FA2);
        }
        
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #FFD700);
            transition: width 0.5s ease;
            border-radius: 5px;
        }
        
        .level-info {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        .word-completed {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            z-index: 50;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            text-shadow: 2px 2px 0 #000;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(0.5); opacity: 0; }
        }
        
        #comboCounter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            display: none;
            z-index: 100;
        }
        
        #dictionary {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #2196F3;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
        }
        
        .dictionary-title {
            font-size: 16px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .dictionary-word {
            font-size: 14px;
            margin: 5px 0;
            color: #FFD700;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a237e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-text {
            font-size: 24px;
            margin-top: 20px;
            color: white;
            text-align: center;
        }
        
        .loading-bar {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        /* Мобильная клавиатура */
        #mobileKeyboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            z-index: 300;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #4CAF50;
        }
        
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin: 8px 0;
        }
        
        .vowel-key {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border: 3px solid white;
            border-radius: 12px;
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .vowel-key:hover, .vowel-key:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #1976D2, #1565C0);
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.7);
        }
        
        .action-key {
            width: 120px;
            height: 55px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border: 3px solid white;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .action-key:hover, .action-key:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
        }
        
        .delete-key {
            background: linear-gradient(135deg, #FF5252, #D32F2F);
        }
        
        .delete-key:hover, .delete-key:active {
            background: linear-gradient(135deg, #D32F2F, #C62828);
            box-shadow: 0 0 15px rgba(255, 82, 82, 0.7);
        }
        
        @media (max-width: 768px) {
            #ui {
                top: 100px; /* Смещаем ниже из-за клавиатуры сверху */
                left: 10px;
                right: 10px;
            }
            
            .stats {
                padding: 10px;
                min-width: auto;
                width: 100%;
            }
            
            .stat-row {
                font-size: 16px;
            }
            
            #wordDisplay {
                font-size: 48px;
                top: 55%; /* Ниже из-за клавиатуры сверху */
            }
            
            #feedback {
                font-size: 28px;
                top: 45%; /* Выше слова */
            }
            
            .vowel-key {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
            
            .action-key {
                width: 100px;
                height: 45px;
                font-size: 16px;
            }
            
            .celebration-text {
                font-size: 36px;
                padding: 0 20px;
            }
            
            .celebration-subtext {
                font-size: 18px;
                padding: 0 20px;
            }
            
            #nextLevelBtn, #restartBtn {
                min-width: 200px;
                font-size: 18px;
                padding: 12px 24px;
            }
            
            .loading-bar {
                width: 250px;
            }
            
            #dictionary {
                bottom: 10px;
                max-width: 200px;
                max-height: 150px;
                font-size: 12px;
            }
            
            .word-completed {
                font-size: 50px;
            }
        }
        
        @media (max-width: 480px) {
            #wordDisplay {
                font-size: 36px;
            }
            
            #feedback {
                font-size: 24px;
            }
            
            .vowel-key {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .action-key {
                width: 90px;
                height: 40px;
                font-size: 14px;
            }
            
            .word-completed {
                font-size: 40px;
            }
        }
        
        @media (max-height: 600px) {
            #wordDisplay {
                font-size: 32px;
            }
            
            #feedback {
                font-size: 20px;
            }
            
            #ui {
                top: 90px;
            }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div style="font-size: 48px; color: #FFD700; margin-bottom: 20px;">❄️ Словарный Сугроб ❄️</div>
        <div class="loading-text" id="loadingText">Загрузка...</div>
        <div class="loading-bar">
            <div id="loadingFill" class="loading-fill" style="width: 0%"></div>
        </div>
    </div>
    
    <div id="gameContainer" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="stats">
                <div class="stat-row">
                    <span>Счёт:</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                    <span>Жизни:</span>
                    <span id="lives" class="stat-value">❤️❤️❤️</span>
                </div>
                <div class="stat-row">
                    <span>Слова:</span>
                    <span id="wordsCount" class="stat-value">0/25</span>
                </div>
                <div class="stat-row">
                    <span>Уровень:</span>
                    <span id="level" class="stat-value">1</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
                <div class="level-info" id="levelInfo">Сложность: Нормальная</div>
                <div id="levelBadge" class="level-badge">Новичок</div>
            </div>
        </div>
        
        <div id="comboCounter">Комбо: 0</div>
        
        <div id="dictionary">
            <div class="dictionary-title">📚 Словарик</div>
            <div id="dictionaryWords"></div>
        </div>
        
        <!-- Слово без плашки -->
        <div id="wordDisplay"></div>
        <div id="feedback"></div>
        
        <!-- Мобильная клавиатура -->
        <div id="mobileKeyboard">
            <div class="keyboard-row">
                <div class="vowel-key" data-letter="а">А</div>
                <div class="vowel-key" data-letter="е">Е</div>
                <div class="vowel-key" data-letter="ё">Ё</div>
                <div class="vowel-key" data-letter="и">И</div>
                <div class="vowel-key" data-letter="о">О</div>
            </div>
            <div class="keyboard-row">
                <div class="vowel-key" data-letter="у">У</div>
                <div class="vowel-key" data-letter="ы">Ы</div>
                <div class="vowel-key" data-letter="э">Э</div>
                <div class="vowel-key" data-letter="ю">Ю</div>
                <div class="vowel-key" data-letter="я">Я</div>
            </div>
            <div class="keyboard-row">
                <div class="action-key delete-key">Удалить</div>
                <div class="action-key" id="submitKey">Готово</div>
            </div>
        </div>
        
        <div id="celebration">
            <div class="celebration-text" id="celebrationTitle">🎉 ПОЗДРАВЛЯЕМ! 🎉</div>
            <div class="celebration-subtext" id="celebrationSubtext"></div>
            <div id="celebrationStats"></div>
            <div id="nextLevelBtn" style="display: none;">🚀 СЛЕДУЮЩИЙ УРОВЕНЬ</div>
            <div id="restartBtn">🔄 ИГРАТЬ СНОВА</div>
        </div>
    </div>

    <script>
        // Слова для игры с пропущенными буквами
        const ALL_WORDS = [
            // Л
            { word: "л.б.ринт", missing: [1, 3], correct: "аи", hint: "запутанные ходы" },
            { word: "л.генда", missing: [1], correct: "е", hint: "рассказ о героическом прошлом" },
            { word: "л.гендарный", missing: [1], correct: "е", hint: "ставший легендой" },
            { word: "л.леять", missing: [1], correct: "е", hint: "нежно заботиться" },
            { word: "л.б.рал", missing: [1, 3], correct: "ие", hint: "сторонник свободы" },
            { word: "л.б.ральный", missing: [1, 3], correct: "ие", hint: "свободный, терпимый" },
            
            // М
            { word: "м.жор", missing: [1], correct: "а", hint: "богатый и стильный человек" },
            { word: "м.жорный", missing: [1], correct: "а", hint: "роскошный, богатый" },
            { word: "м.териал", missing: [1], correct: "а", hint: "вещество, исходник" },
            { word: "м.териальный", missing: [1], correct: "а", hint: "вещественный, реальный" },
            { word: "м.териализм", missing: [1], correct: "а", hint: "философское направление" },
            { word: "м.териализовать", missing: [1], correct: "а", hint: "воплощать в жизнь" },
            { word: "мгн.вение", missing: [3], correct: "о", hint: "очень короткий промежуток времени" },
            { word: "мгн.венный", missing: [3], correct: "о", hint: "очень быстрый, мгновенный" },
            { word: "м.нтал.тет", missing: [1, 6], correct: "еи", hint: "склад ума, мышления" },
            { word: "м.нтальный", missing: [1], correct: "е", hint: "относящийся к уму" },
            { word: "м.р.диан", missing: [1, 3], correct: "еи", hint: "линия долготы на глобусе" },
            { word: "м.роприятие", missing: [1], correct: "е", hint: "организованное действие" },
            { word: "м.тафора", missing: [1], correct: "е", hint: "образное выражение" },
            { word: "м.тафорический", missing: [1], correct: "е", hint: "образный, иносказательный" },
            { word: "м.ханизм", missing: [1], correct: "е", hint: "устройство, система" },
            { word: "м.ханический", missing: [1], correct: "е", hint: "действующий как механизм" },
            { word: "м.нерал", missing: [1], correct: "и", hint: "природное неорганическое вещество" },
            { word: "м.неральный", missing: [1], correct: "и", hint: "содержащий минералы" },
            { word: "м.нор", missing: [1], correct: "и", hint: "музыкальный лад" },
            { word: "м.норный", missing: [1], correct: "и", hint: "грустный, печальный" },
            { word: "м.н.лит", missing: [1, 3], correct: "оо", hint: "единая каменная глыба" },
            { word: "м.н.литный", missing: [1, 3 ], correct: "оо", hint: "составляющий единое целое" },
            { word: "м.р.торий", missing: [1, 3], correct: "оа", hint: "временный запрет" },
            { word: "м.тив", missing: [1], correct: "о", hint: "причина, побуждение к действию" },
            { word: "м.тивировать", missing: [1], correct: "о", hint: "побуждать к действию" },
            { word: "м.тивация", missing: [1], correct: "о", hint: "побуждение к действию" },
            { word: "м.теж", missing: [1], correct: "я", hint: "восстание, бунт" },
            { word: "м.тежный", missing: [1], correct: "я", hint: "мятежный, бунтарский" }
        ];

        const LEVEL_NAMES = {
            1: "Новичок",
            2: "Знаток", 
            3: "Эксперт"
        };

        const LEVEL_SETTINGS = {
            1: { 
                speed: 1, 
                scoreMultiplier: 1, 
                snowdriftSpeed: 2, 
                snowdriftInterval: 2000,
                wordsPerLevel: 25,
                maxSnowdrifts: 15
            },
            2: { 
                speed: 1.3, 
                scoreMultiplier: 1.5, 
                snowdriftSpeed: 3, 
                snowdriftInterval: 1500,
                wordsPerLevel: 25,
                maxSnowdrifts: 20
            },
            3: { 
                speed: 1.6, 
                scoreMultiplier: 2, 
                snowdriftSpeed: 4, 
                snowdriftInterval: 1000,
                wordsPerLevel: 25,
                maxSnowdrifts: 25
            }
        };

        // Игровые переменные
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = 'playing';
        let score = 0;
        let lives = 3;
        let level = 1;
        let currentWordIndex = 0;
        let learnedWords = new Map();
        let correctInRow = 0;
        let combo = 0;
        let currentWord = null;
        let currentSelection = [];
        let currentMissingIndex = 0;
        let snowflakes = [];
        let particles = [];
        let player = { x: 0, y: 0, width: 120, height: 180, direction: 'right' };
        let snowdrifts = [];
        let animationId = null;
        let allWordsCompleted = false;
        let lastSnowdriftTime = 0;
        let confetti = [];
        let availableWords = [...ALL_WORDS];
        let currentSnowdriftId = null;
        let explodingSnowdrifts = [];

        // Загружаемые изображения
        const images = {
            background: null,
            janitor_left: null,
            janitor_right: null,
            roof: null,
            snowdrift: null
        };

        // DOM элементы
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingText = document.getElementById('loadingText');
        const loadingFill = document.getElementById('loadingFill');
        const gameContainer = document.getElementById('gameContainer');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const wordsCountElement = document.getElementById('wordsCount');
        const levelElement = document.getElementById('level');
        const progressFill = document.getElementById('progressFill');
        const levelInfo = document.getElementById('levelInfo');
        const levelBadge = document.getElementById('levelBadge');
        const dictionaryWords = document.getElementById('dictionaryWords');
        const wordDisplay = document.getElementById('wordDisplay');
        const feedbackElement = document.getElementById('feedback');
        const mobileKeyboard = document.getElementById('mobileKeyboard');
        const vowelKeys = document.querySelectorAll('.vowel-key');
        const submitKey = document.getElementById('submitKey');
        const celebration = document.getElementById('celebration');
        const celebrationTitle = document.getElementById('celebrationTitle');
        const celebrationSubtext = document.getElementById('celebrationSubtext');
        const celebrationStats = document.getElementById('celebrationStats');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const restartBtn = document.getElementById('restartBtn');
        const comboCounter = document.getElementById('comboCounter');

        // Загрузка изображений
        function loadImages() {
            const imageFiles = [
                { key: 'background', src: 'winter_background.png' },
                { key: 'janitor_left', src: 'janitor_left.png' },
                { key: 'janitor_right', src: 'janitor_right.png' },
                { key: 'roof', src: 'roof.png' },
                { key: 'snowdrift', src: 'snowdrift.png' }
            ];

            let loadedCount = 0;
            const totalCount = imageFiles.length;

            imageFiles.forEach((file) => {
                const img = new Image();
                img.onload = () => {
                    images[file.key] = img;
                    loadedCount++;
                    
                    const progress = Math.round((loadedCount / totalCount) * 100);
                    loadingFill.style.width = `${progress}%`;
                    loadingText.textContent = `Загружено: ${loadedCount}/${totalCount} изображений`;
                    
                    if (loadedCount === totalCount) {
                        setTimeout(() => {
                            loadingScreen.style.opacity = '0';
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                                gameContainer.style.display = 'block';
                                initGame();
                            }, 500);
                        }, 500);
                    }
                };
                
                img.onerror = () => {
                    console.warn(`Не удалось загрузить изображение: ${file.src}`);
                    loadedCount++;
                    
                    const progress = Math.round((loadedCount / totalCount) * 100);
                    loadingFill.style.width = `${progress}%`;
                    
                    if (loadedCount === totalCount) {
                        setTimeout(() => {
                            loadingScreen.style.opacity = '0';
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                                gameContainer.style.display = 'block';
                                initGame();
                            }, 500);
                        }, 500);
                    }
                };
                
                img.src = file.src;
            });
        }

        // Инициализация игры
        function initGame() {
            gameState = 'playing';
            
            resizeCanvas();
            
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
            player.direction = 'right';
            
            initSnowflakes();
            
            score = 0;
            lives = 3;
            learnedWords.clear();
            availableWords = [...ALL_WORDS].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            correctInRow = 0;
            combo = 0;
            allWordsCompleted = false;
            confetti = [];
            snowdrifts = [];
            explodingSnowdrifts = [];
            
            updateUI();
            updateProgress();
            updateCombo();
            updateDictionary();
            
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
            
            setTimeout(() => createSnowdrift(), 1000);
            
            // Показываем мобильную клавиатуру на мобильных устройствах
            if (isMobile()) {
                setupMobileKeyboard();
            }
        }

        // Проверка мобильного устройства
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Настройка мобильной клавиатуры
        function setupMobileKeyboard() {
            // Добавляем обработчики для гласных
            vowelKeys.forEach(key => {
                key.addEventListener('click', () => {
                    const letter = key.getAttribute('data-letter');
                    selectLetter(letter);
                });
                
                key.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    key.style.transform = 'scale(0.95)';
                });
                
                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    key.style.transform = 'scale(1)';
                    const letter = key.getAttribute('data-letter');
                    selectLetter(letter);
                });
            });
            
            // Кнопка "Удалить"
            document.querySelector('.delete-key').addEventListener('click', () => {
                if (currentMissingIndex > 0) {
                    currentMissingIndex--;
                    currentSelection[currentMissingIndex] = null;
                    updateWordDisplay();
                }
            });
            
            // Кнопка "Готово"
            submitKey.addEventListener('click', () => {
                if (currentMissingIndex >= currentWord.correct.length) {
                    completeWord(true);
                }
            });
        }

        // Создание сугроба
        function createSnowdrift() {
            if (gameState !== 'playing') return;
            
            const now = Date.now();
            const settings = LEVEL_SETTINGS[level];
            
            if (now - lastSnowdriftTime < settings.snowdriftInterval) return;
            
            // Проверяем максимальное количество сугробов
            if (snowdrifts.length >= settings.maxSnowdrifts) return;
            
            // Получаем слово
            let wordData;
            if (level === 1) {
                // На первом уровне - новые слова без повторений
                if (learnedWords.size >= settings.wordsPerLevel) {
                    return; // Все слова изучены
                }
                
                // Берем следующее слово из перемешанного списка
                wordData = availableWords[currentWordIndex];
                currentWordIndex = (currentWordIndex + 1) % availableWords.length;
            } else {
                // На остальных уровнях - перемешанные слова
                wordData = availableWords[Math.floor(Math.random() * availableWords.length)];
            }
            
            // Находим свободное место для нового сугроба
            let x, attempts = 0;
            let columnOccupied = false;
            
            do {
                x = 50 + Math.random() * (canvas.width - 100);
                columnOccupied = false;
                
                // Проверяем, занят ли этот столбец
                for (const snowdrift of snowdrifts) {
                    if (Math.abs(snowdrift.x - x) < 60) {
                        columnOccupied = true;
                        break;
                    }
                }
                
                attempts++;
            } while (columnOccupied && attempts < 50);
            
            // Если все столбцы заняты, ставим в случайное место
            if (columnOccupied) {
                x = 50 + Math.random() * (canvas.width - 100);
            }
            
            const snowdrift = {
                x: x,
                y: -70,
                width: 70,
                height: 50,
                word: wordData,
                speed: settings.snowdriftSpeed * (0.8 + Math.random() * 0.4),
                collected: false,
                onGround: false,
                id: Date.now(),
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.05,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.03 + Math.random() * 0.02,
                targetY: canvas.height - 70
            };
            
            // Если есть сугроб в этом столбце, корректируем targetY выше
            for (const other of snowdrifts) {
                if (Math.abs(other.x - x) < 60 && other.onGround) {
                    snowdrift.targetY = other.y - 60;
                    break;
                }
            }
            
            snowdrifts.push(snowdrift);
            lastSnowdriftTime = now;
        }

        // Инициализация снежинок
        function initSnowflakes() {
            snowflakes = [];
            for (let i = 0; i < 80; i++) {
                snowflakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 1 + 0.5,
                    sway: Math.random() * 0.3,
                    opacity: Math.random() * 0.3 + 0.3
                });
            }
        }

        // Обновление игры
        function updateGame() {
            if (gameState !== 'playing') return;
            
            updateSnowflakes();
            updateSnowdrifts();
            updateExplodingSnowdrifts();
            updateParticles();
            updateConfetti();
            
            const now = Date.now();
            if (now - lastSnowdriftTime > LEVEL_SETTINGS[level].snowdriftInterval) {
                createSnowdrift();
            }
        }

        // Обновление снежинок
        function updateSnowflakes() {
            snowflakes.forEach(flake => {
                flake.y += flake.speed;
                flake.x += Math.sin(flake.y * 0.01) * flake.sway;
                
                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }
            });
        }

        // Обновление сугробов
        function updateSnowdrifts() {
            for (let i = snowdrifts.length - 1; i >= 0; i--) {
                const snowdrift = snowdrifts[i];
                
                if (!snowdrift.onGround) {
                    // Анимация падения
                    snowdrift.y += snowdrift.speed;
                    snowdrift.rotation += snowdrift.rotationSpeed;
                    snowdrift.wobble += snowdrift.wobbleSpeed;
                    
                    // Небольшое качание при падении
                    snowdrift.x += Math.sin(snowdrift.wobble) * 0.5;
                    
                    if (snowdrift.y >= snowdrift.targetY) {
                        snowdrift.y = snowdrift.targetY;
                        snowdrift.onGround = true;
                        snowdrift.speed = 0;
                        snowdrift.rotationSpeed = 0;
                        snowdrift.wobbleSpeed = 0.01;
                    }
                    
                    if (checkCollision(player, snowdrift)) {
                        startWordGame(snowdrift);
                    }
                } else {
                    // Качание на земле
                    snowdrift.wobble += snowdrift.wobbleSpeed;
                    snowdrift.x += Math.sin(snowdrift.wobble) * 0.1;
                    
                    // Ограничиваем движение по земле
                    if (snowdrift.x < 50) snowdrift.x = 50;
                    if (snowdrift.x > canvas.width - 50 - snowdrift.width) snowdrift.x = canvas.width - 50 - snowdrift.width;
                    
                    if (checkCollision(player, snowdrift)) {
                        startWordGame(snowdrift);
                    }
                }
            }
        }

        // Обновление разлетающихся сугробов
        function updateExplodingSnowdrifts() {
            for (let i = explodingSnowdrifts.length - 1; i >= 0; i--) {
                const particle = explodingSnowdrifts[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                particle.vy += 0.1;
                
                if (particle.life <= 0) {
                    explodingSnowdrifts.splice(i, 1);
                }
            }
        }

        // Анимация разлета сугроба
        function explodeSnowdrift(snowdrift) {
            // Создаем частицы для разлета
            for (let i = 0; i < 15; i++) {
                explodingSnowdrifts.push({
                    x: snowdrift.x + snowdrift.width/2,
                    y: snowdrift.y + snowdrift.height/2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 4,
                    life: 1,
                    width: snowdrift.width * 0.3,
                    height: snowdrift.height * 0.3,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            
            // Опускаем сугробы выше в этом столбце
            for (let i = 0; i < snowdrifts.length; i++) {
                if (Math.abs(snowdrifts[i].x - snowdrift.x) < 60 && 
                    snowdrifts[i].y < snowdrift.y) {
                    snowdrifts[i].targetY += 60;
                    
                    if (snowdrifts[i].onGround) {
                        snowdrifts[i].onGround = false;
                        snowdrifts[i].speed = LEVEL_SETTINGS[level].snowdriftSpeed;
                    }
                }
            }
        }

        // Проверка столкновения
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Начало мини-игры со словом
        function startWordGame(snowdrift) {
            if (currentWord !== null) return;
            
            currentWord = snowdrift.word;
            currentSnowdriftId = snowdrift.id;
            currentSelection = new Array(currentWord.correct.length).fill(null);
            currentMissingIndex = 0;
            
            showWordPopup();
        }

        // Показ попапа со словом
        function showWordPopup() {
            wordDisplay.style.display = 'block';
            updateWordDisplay();
            
            // Показываем мобильную клавиатуру на мобильных устройствах
            if (isMobile()) {
                mobileKeyboard.style.display = 'flex';
            }
        }

        // Скрытие попапа
        function hideWordPopup() {
            wordDisplay.style.display = 'none';
            feedbackElement.style.display = 'none';
            feedbackElement.textContent = '';
            feedbackElement.className = '';
            currentWord = null;
            currentSnowdriftId = null;
            
            // Скрываем мобильную клавиатуру
            mobileKeyboard.style.display = 'none';
        }

        // Обновление отображения слова
        function updateWordDisplay() {
            if (!currentWord) return;
            
            let display = '';
            let missingIndex = 0;
            
            for (let i = 0; i < currentWord.word.length; i++) {
                const char = currentWord.word[i];
                
                if (currentWord.missing.includes(i)) {
                    const userLetter = currentSelection[missingIndex];
                    let className = 'word-char missing-char';
                    
                    if (userLetter) {
                        const correctLetter = currentWord.correct[missingIndex];
                        if (userLetter === correctLetter) {
                            className = 'word-char correct-char';
                        } else {
                            className = 'word-char wrong-char';
                        }
                        display += `<span class="${className}">${userLetter}</span>`;
                    } else {
                        display += `<span class="${className}">_</span>`;
                    }
                    missingIndex++;
                } else {
                    display += `<span class="word-char">${char}</span>`;
                }
            }
            
            wordDisplay.innerHTML = display;
        }

        // Выбор буквы
        function selectLetter(letter) {
            if (!currentWord || currentMissingIndex >= currentWord.correct.length) return;
            
            currentSelection[currentMissingIndex] = letter;
            updateWordDisplay();
            
            const correctLetter = currentWord.correct[currentMissingIndex];
            const isCorrect = letter === correctLetter;
            
            if (isCorrect) {
                feedbackElement.textContent = '✓ Правильно!';
                feedbackElement.className = 'correct';
                feedbackElement.style.display = 'block';
                createParticles('#4CAF50', canvas.width/2, canvas.height/2);
                createWordCompleted('✓', '#4CAF50');
                
                currentMissingIndex++;
                
                if (currentMissingIndex >= currentWord.correct.length) {
                    setTimeout(() => completeWord(true), 500);
                }
            } else {
                feedbackElement.textContent = '✗ Неправильно';
                feedbackElement.className = 'wrong';
                feedbackElement.style.display = 'block';
                createParticles('#FF5252', canvas.width/2, canvas.height/2);
                createWordCompleted('✗', '#FF5252');
                loseLife();
                combo = 0;
                updateCombo();
                
                currentMissingIndex++;
                
                if (currentMissingIndex >= currentWord.correct.length) {
                    setTimeout(() => completeWord(false), 500);
                }
            }
        }

        // Завершение слова
        function completeWord(isCorrect) {
            const wordKey = currentWord.word;
            const fullWord = getFullWord(currentWord);
            
            if (isCorrect) {
                let wordScore = 100 * LEVEL_SETTINGS[level].scoreMultiplier;
                
                if (combo > 0) {
                    wordScore += combo * 25;
                }
                
                score += wordScore;
                correctInRow++;
                combo++;
                
                if (!learnedWords.has(wordKey)) {
                    learnedWords.set(wordKey, {
                        word: fullWord,
                        hint: currentWord.hint
                    });
                    updateDictionary();
                }
                
                createParticles('#FFD700', canvas.width/2, canvas.height/2);
                createConfetti();
                
                // Находим и удаляем сугроб с анимацией разлета
                const index = snowdrifts.findIndex(s => s.id === currentSnowdriftId);
                if (index > -1) {
                    const snowdrift = snowdrifts[index];
                    explodeSnowdrift(snowdrift);
                    snowdrifts.splice(index, 1);
                }
                
                // Проверяем, изучены ли все слова для текущего уровня
                if (level === 1 && learnedWords.size >= LEVEL_SETTINGS[level].wordsPerLevel) {
                    allWordsCompleted = true;
                    setTimeout(() => showCelebration(true), 1000);
                }
            } else {
                correctInRow = 0;
                combo = 0;
                createParticles('#FF5252', canvas.width/2, canvas.height/2);
            }
            
            updateUI();
            updateProgress();
            updateCombo();
            
            setTimeout(() => {
                hideWordPopup();
            }, 500);
        }

        // Потеря жизни
        function loseLife() {
            lives--;
            
            if (lives <= 0) {
                gameOver();
            }
            
            updateUI();
            createParticles('#FF5252', player.x + player.width/2, player.y + player.height/2);
        }

        // Конец игры
        function gameOver() {
            gameState = 'gameOver';
            showCelebration(false);
        }

        // Получение полного слова
        function getFullWord(wordData) {
            let result = '';
            let missingIndex = 0;
            
            for (let i = 0; i < wordData.word.length; i++) {
                if (wordData.missing.includes(i)) {
                    result += wordData.correct[missingIndex];
                    missingIndex++;
                } else {
                    result += wordData.word[i];
                }
            }
            
            return result;
        }

        // Показ экрана поздравления
        function showCelebration(isVictory) {
            if (isVictory) {
                celebrationTitle.textContent = '🎉 ВСЕ СЛОВА ИЗУЧЕНЫ! 🎉';
                celebrationSubtext.textContent = getRandomPraise();
                
                const statsHTML = `
                    <div style="text-align: center; margin: 30px 0; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; max-width: 500px;">
                        <div style="font-size: 24px; color: #FFD700; margin: 10px 0;">
                            Уровень "${LEVEL_NAMES[level]}" завершён!
                        </div>
                        <div style="font-size: 18px; color: #4CAF50; margin: 10px 0;">
                            📚 Изучено слов: ${learnedWords.size}/${LEVEL_SETTINGS[level].wordsPerLevel}
                        </div>
                        <div style="font-size: 18px; color: #2196F3; margin: 10px 0;">
                            🎯 Точность: ${Math.round((learnedWords.size / (learnedWords.size + (3 - lives))) * 100)}%
                        </div>
                        <div style="font-size: 18px; color: #FF9800; margin: 10px 0;">
                            ⭐ Счёт: ${score}
                        </div>
                        <div style="font-size: 16px; color: #aaa; margin-top: 15px;">
                            Следующий уровень: сугробы падают быстрее!
                        </div>
                    </div>
                `;
                
                celebrationStats.innerHTML = statsHTML;
                
                if (level < 3) {
                    nextLevelBtn.style.display = 'block';
                    nextLevelBtn.textContent = `🚀 УРОВЕНЬ ${level+1}: ${LEVEL_NAMES[level+1].toUpperCase()}`;
                } else {
                    nextLevelBtn.style.display = 'none';
                    celebrationSubtext.textContent = 'Вы достигли максимального уровня! Вы — настоящий мастер русского языка!';
                    celebrationTitle.innerHTML = '👑 ПОБЕДА! ВЫ СТАЛИ ГЕНИЕМ РУССКОГО ЯЗЫКА! 👑';
                }
            } else {
                celebrationTitle.textContent = '❄️ ИГРА ОКОНЧЕНА ❄️';
                celebrationSubtext.textContent = 'Попробуйте ещё раз!';
                nextLevelBtn.style.display = 'none';
                
                const statsHTML = `
                    <div style="text-align: center; margin: 30px 0; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; max-width: 500px;">
                        <div style="font-size: 24px; color: #FFD700; margin: 10px 0;">
                            Итоговый счёт: ${score}
                        </div>
                        <div style="font-size: 18px; color: #4CAF50; margin: 10px 0;">
                            📚 Изучено слов: ${learnedWords.size}
                        </div>
                        <div style="font-size: 18px; color: #2196F3; margin: 10px 0;">
                            🎯 Точность: ${learnedWords.size > 0 ? Math.round((learnedWords.size / (learnedWords.size + (3 - lives))) * 100) : 0}%
                        </div>
                        <div style="font-size: 18px; color: #FF9800; margin: 10px 0;">
                            🏆 Уровень: ${LEVEL_NAMES[level]}
                        </div>
                    </div>
                `;
                
                celebrationStats.innerHTML = statsHTML;
            }
            
            celebration.style.display = 'flex';
            createMassiveConfetti();
        }

        // Случайные похвалы
        function getRandomPraise() {
            const praises = [
                'Блестящий результат! Ваш словарный запас впечатляет!',
                'Потрясающе! Вы настоящий знаток русского языка!',
                'Великолепно! Каждое слово — как родное!',
                'Фантастика! Вы справились идеально!',
                'Изумительно! Русский язык — ваша стихия!'
            ];
            
            return praises[Math.floor(Math.random() * praises.length)];
        }

        // Переход на следующий уровень
        function nextLevel() {
            level++;
            allWordsCompleted = false;
            availableWords = [...ALL_WORDS].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            correctInRow = 0;
            combo = 0;
            snowdrifts = [];
            explodingSnowdrifts = [];
            
            celebration.style.display = 'none';
            gameState = 'playing';
            
            updateUI();
            updateProgress();
            updateCombo();
            
            createLevelTransition();
            
            setTimeout(() => createSnowdrift(), 1000);
        }

        // Эффект перехода уровня
        function createLevelTransition() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createParticles('#FFD700', canvas.width/2, canvas.height/2);
                }, i * 20);
            }
            
            levelBadge.style.animation = 'none';
            setTimeout(() => {
                levelBadge.style.animation = 'pulse 2s infinite';
            }, 100);
        }

        // Создание частиц
        function createParticles(color, x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x || canvas.width/2,
                    y: y || canvas.height/2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 4,
                    life: 1,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // Создание конфетти
        function createConfetti() {
            const colors = ['#FF4081', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#FFD700'];
            for (let i = 0; i < 20; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    width: Math.random() * 8 + 4,
                    height: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 8
                });
            }
        }

        // Массивное конфетти для победы
        function createMassiveConfetti() {
            const colors = ['#FF4081', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#FFD700'];
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    confetti.push({
                        x: Math.random() * canvas.width,
                        y: -20,
                        width: Math.random() * 12 + 4,
                        height: Math.random() * 12 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        speed: Math.random() * 6 + 3,
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 12
                    });
                }, i * 15);
            }
        }

        // Обновление конфетти
        function updateConfetti() {
            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.y += c.speed;
                c.rotation += c.rotationSpeed;
                
                if (c.y > canvas.height + 50) {
                    confetti.splice(i, 1);
                }
            }
        }

        // Обновление частиц
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.vy += 0.2;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Создание анимации завершения слова
        function createWordCompleted(text, color) {
            const element = document.createElement('div');
            element.className = 'word-completed';
            element.textContent = text;
            element.style.color = color;
            element.style.left = '50%';
            element.style.top = '50%';
            element.style.transform = 'translate(-50%, -50%)';
            
            document.getElementById('gameContainer').appendChild(element);
            
            setTimeout(() => {
                element.remove();
            }, 2000);
        }

        // Отрисовка игры
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка фона
            if (images.background) {
                ctx.drawImage(images.background, 0, 0, canvas.width, canvas.height);
            } else {
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#1a237e');
                gradient.addColorStop(0.5, '#283593');
                gradient.addColorStop(1, '#3949ab');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Крыша внизу
            if (images.roof) {
                const roofAspectRatio = 1.5;
                const roofWidth = canvas.width * 0.7;
                const roofHeight = roofWidth / roofAspectRatio;
                const roofX = canvas.width/2 - roofWidth/2;
                const roofY = canvas.height - roofHeight - 20;
                ctx.drawImage(images.roof, roofX, roofY, roofWidth, roofHeight);
            }
            
            // Снежинки
            snowflakes.forEach(flake => {
                ctx.globalAlpha = flake.opacity;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Игрок (дворник)
            let playerImage = player.direction === 'left' ? images.janitor_left : images.janitor_right;
            if (playerImage) {
                const walkOffset = Math.sin(Date.now() * 0.005) * 3;
                ctx.drawImage(playerImage, player.x, player.y + walkOffset, player.width, player.height);
            } else {
                ctx.fillStyle = player.direction === 'left' ? '#FF5722' : '#FF9800';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
            
            // Разлетающиеся сугробы
            explodingSnowdrifts.forEach(particle => {
                ctx.save();
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.rotation * Math.PI / 180);
                ctx.globalAlpha = particle.life;
                
                if (images.snowdrift) {
                    ctx.drawImage(
                        images.snowdrift,
                        -particle.width/2,
                        -particle.height/2,
                        particle.width,
                        particle.height
                    );
                } else {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-particle.width/2, -particle.height/2, particle.width, particle.height);
                }
                
                ctx.restore();
            });
            ctx.globalAlpha = 1;
            
            // Сугробы
            snowdrifts.forEach(snowdrift => {
                if (images.snowdrift) {
                    ctx.save();
                    ctx.translate(snowdrift.x + snowdrift.width/2, snowdrift.y + snowdrift.height/2);
                    ctx.rotate(snowdrift.rotation);
                    
                    ctx.drawImage(
                        images.snowdrift, 
                        -snowdrift.width/2, 
                        -snowdrift.height/2, 
                        snowdrift.width, 
                        snowdrift.height
                    );
                    
                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(snowdrift.x + snowdrift.width/2, snowdrift.y + snowdrift.height/2);
                    ctx.rotate(snowdrift.rotation);
                    
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, snowdrift.width/2);
                    gradient.addColorStop(0, '#FFFFFF');
                    gradient.addColorStop(1, '#E3F2FD');
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, snowdrift.width/2, snowdrift.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            });
            
            // Конфетти
            confetti.forEach(c => {
                ctx.save();
                ctx.translate(c.x + c.width/2, c.y + c.height/2);
                ctx.rotate(c.rotation * Math.PI / 180);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.width/2, -c.height/2, c.width, c.height);
                ctx.restore();
            });
            
            // Частицы
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Обновление UI
        function updateUI() {
            scoreElement.textContent = score;
            livesElement.textContent = '❤️'.repeat(Math.max(0, lives));
            
            wordsCountElement.textContent = `${learnedWords.size}/${LEVEL_SETTINGS[level].wordsPerLevel}`;
            levelElement.textContent = level;
            
            levelInfo.textContent = `Сложность: ${LEVEL_NAMES[level]}`;
            levelBadge.textContent = LEVEL_NAMES[level];
            
            const colors = ['#4CAF50', '#2196F3', '#FF9800'];
            levelBadge.style.background = `linear-gradient(45deg, ${colors[level-1]}, ${colors[level % colors.length]})`;
        }

        // Обновление прогресса
        function updateProgress() {
            const progress = LEVEL_SETTINGS[level].wordsPerLevel > 0 ? 
                (learnedWords.size / LEVEL_SETTINGS[level].wordsPerLevel) * 100 : 0;
            progressFill.style.width = `${progress}%`;
        }

        // Обновление комбо
        function updateCombo() {
            if (combo > 1) {
                comboCounter.textContent = `Комбо: ${combo} × ${25 * combo} бонус`;
                comboCounter.style.display = 'block';
                
                comboCounter.style.animation = 'none';
                setTimeout(() => {
                    comboCounter.style.animation = 'pulse 0.5s';
                }, 10);
            } else {
                comboCounter.style.display = 'none';
            }
        }

        // Обновление словарика
        function updateDictionary() {
            dictionaryWords.innerHTML = '';
            
            if (learnedWords.size === 0) {
                dictionaryWords.innerHTML = '<div style="color: #aaa; font-style: italic;">Изученных слов пока нет</div>';
                return;
            }
            
            const sortedWords = Array.from(learnedWords.entries()).sort((a, b) => 
                a[1].word.localeCompare(b[1].word)
            );
            
            sortedWords.forEach(([key, wordData]) => {
                const wordElement = document.createElement('div');
                wordElement.className = 'dictionary-word';
                wordElement.innerHTML = `
                    <strong>${wordData.word}</strong><br>
                    <small style="color: #aaa;">${wordData.hint}</small>
                `;
                dictionaryWords.appendChild(wordElement);
            });
        }

        // Игровой цикл
        function gameLoop() {
            updateGame();
            drawGame();
            animationId = requestAnimationFrame(gameLoop);
        }

        // Изменение размера canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
        }

        // Управление игроком
        let touchStartX = 0;
        let isDragging = false;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            isDragging = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || gameState !== 'playing') return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            touchStartX = touch.clientX;
            
            player.x += deltaX * 1.5;
            
            if (deltaX > 0) {
                player.direction = 'right';
            } else if (deltaX < 0) {
                player.direction = 'left';
            }
            
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (gameState === 'playing') {
                const speed = 20;
                
                switch(e.key) {
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        player.x = Math.max(0, player.x - speed);
                        player.direction = 'left';
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        player.x = Math.min(canvas.width - player.width, player.x + speed);
                        player.direction = 'right';
                        break;
                }
            }
            
            if (currentWord !== null) {
                const key = e.key.toLowerCase();
                const russianVowels = 'аеёиоуыэюя';
                
                if (russianVowels.includes(key)) {
                    selectLetter(key);
                    e.preventDefault();
                } else if (e.key === 'Backspace') {
                    if (currentMissingIndex > 0) {
                        currentMissingIndex--;
                        currentSelection[currentMissingIndex] = null;
                        updateWordDisplay();
                    }
                    e.preventDefault();
                } else if (e.key === 'Enter') {
                    if (currentMissingIndex >= currentWord.correct.length) {
                        completeWord(true);
                    }
                    e.preventDefault();
                }
            }
        });

        // Обработчики кнопок
        nextLevelBtn.addEventListener('click', nextLevel);
        restartBtn.addEventListener('click', () => {
            celebration.style.display = 'none';
            gameState = 'playing';
            level = 1;
            initGame();
        });

        // Обработка изменения размера окна
        window.addEventListener('resize', resizeCanvas);

        // Запуск игры при загрузке страницы
        window.addEventListener('load', () => {
            loadImages();
        });
    </script>
</body>
</html>
