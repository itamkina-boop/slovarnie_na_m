<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Словарный Сугроб</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .stats {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            border: 3px solid #4CAF50;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 18px;
        }
        
        .stat-value {
            color: #FFD700;
            font-weight: bold;
        }
        
        .level-badge {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        #wordPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #4CAF50;
            z-index: 200;
            width: 90%;
            max-width: 500px;
            display: none;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.5);
        }
        
        #wordDisplay {
            font-size: 36px;
            text-align: center;
            margin: 20px 0;
            min-height: 60px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        #feedback {
            font-size: 24px;
            text-align: center;
            min-height: 40px;
            margin: 15px 0;
            transition: all 0.3s;
        }
        
        .correct { 
            color: #4CAF50; 
            animation: float 0.5s ease-in-out;
        }
        
        .wrong { 
            color: #FF5252; 
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        #celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .celebration-text {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #000;
            animation: float 2s ease-in-out infinite;
        }
        
        .celebration-subtext {
            font-size: 24px;
            text-align: center;
            margin-bottom: 40px;
            color: #4CAF50;
            max-width: 80%;
            line-height: 1.5;
        }
        
        #nextLevelBtn, #restartBtn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
            border: 3px solid white;
            border-radius: 25px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            min-width: 250px;
            text-align: center;
        }
        
        #nextLevelBtn:hover, #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
        }
        
        #nextLevelBtn {
            background: linear-gradient(45deg, #FF4081, #7B1FA2);
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
        }
        
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #FFD700);
            transition: width 0.5s ease;
            border-radius: 5px;
        }
        
        .level-info {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        .word-completed {
            position: absolute;
            font-size: 40px;
            font-weight: bold;
            z-index: 50;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }
        
        #comboCounter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            display: none;
            z-index: 100;
        }
        
        #dictionary {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #2196F3;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
        }
        
        .dictionary-title {
            font-size: 16px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .dictionary-word {
            font-size: 14px;
            margin: 5px 0;
            color: #FFD700;
        }
        
        #keyboardHint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #4CAF50;
            font-size: 14px;
            color: #FFD700;
            z-index: 100;
            display: none;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a237e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-text {
            font-size: 24px;
            margin-top: 20px;
            color: white;
            text-align: center;
        }
        
        .loading-bar {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        #soundToggle {
            position: absolute;
            top: 20px;
            right: 100px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #FF9800;
            font-size: 20px;
            color: #FFD700;
            z-index: 100;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #soundToggle:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.9);
        }
        
        #weatherIndicator {
            position: absolute;
            top: 20px;
            right: 220px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid #2196F3;
            font-size: 16px;
            color: #FFD700;
            z-index: 100;
        }
        
        @media (max-width: 768px) {
            #ui {
                top: 10px;
                left: 10px;
                right: 10px;
            }
            
            .stats {
                padding: 10px;
                min-width: auto;
                width: 100%;
            }
            
            .stat-row {
                font-size: 16px;
            }
            
            #wordDisplay {
                font-size: 28px;
            }
            
            .celebration-text {
                font-size: 36px;
                padding: 0 20px;
            }
            
            .celebration-subtext {
                font-size: 18px;
                padding: 0 20px;
            }
            
            #nextLevelBtn, #restartBtn {
                min-width: 200px;
                font-size: 18px;
                padding: 12px 24px;
            }
            
            .loading-bar {
                width: 250px;
            }
            
            #dictionary, #keyboardHint, #soundToggle, #weatherIndicator {
                bottom: 10px;
                max-width: 200px;
                max-height: 150px;
                font-size: 12px;
            }
            
            #soundToggle {
                top: 10px;
                right: 80px;
                font-size: 18px;
                padding: 8px 12px;
            }
            
            #weatherIndicator {
                top: 10px;
                right: 170px;
                font-size: 14px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div style="font-size: 48px; color: #FFD700; margin-bottom: 20px;">❄️ Словарный Сугроб ❄️</div>
        <div class="loading-text" id="loadingText">Загрузка...</div>
        <div class="loading-bar">
            <div id="loadingFill" class="loading-fill" style="width: 0%"></div>
        </div>
    </div>
    
    <div id="gameContainer" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="stats">
                <div class="stat-row">
                    <span>Счёт:</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                    <span>Жизни:</span>
                    <span id="lives" class="stat-value">❤️❤️❤️</span>
                </div>
                <div class="stat-row">
                    <span>Слова:</span>
                    <span id="wordsCount" class="stat-value">0/25</span>

                <div class="stat-row">
                    <span>Уровень:</span>

                </div>

        <div id="comboCounter">Комбо: 0</div>
        <div id="soundToggle" title="Вкл/Выкл звук">🔊</div>
        <div id="weatherIndicator" title="Погода">☀️ Солнечно</div>
        
        <div id="dictionary">
            <div class="dictionary-title">📚 Словарик</div>

        </div>
        
        <div id="keyboardHint">⌨️ Вводите буквы с клавиатуры</div>
        
        <div id="wordPopup">
            <div id="wordDisplay"></div>
            <div id="feedback"></div>
        </div>
        
        <div id="celebration">
            <div class="celebration-text" id="celebrationTitle">🎉 ПОЗДРАВЛЯЕМ! 🎉</div>
            <div class="celebration-subtext" id="celebrationSubtext"></div>
            <div id="celebrationStats"></div>
            <div id="nextLevelBtn" style="display: none;">🚀 СЛЕДУЮЩИЙ УРОВЕНЬ</div>
            <div id="restartBtn">🔄 ИГРАТЬ СНОВА</div>
        </div>
    </div>

    <script>
        // Слова для игры с пропущенными буквами
        const ALL_WORDS = [
            // Л
            { word: "л.б.ринт", missing: [1, 3], correct: "аи", hint: "запутанные ходы" },
            { word: "л.генда", missing: [1], correct: "е", hint: "рассказ о героическом прошлом" },
            { word: "л.гендарный", missing: [1], correct: "е", hint: "ставший легендой" },
            { word: "л.леять", missing: [1], correct: "е", hint: "нежно заботиться" },
            { word: "л.б.рал", missing: [1, 3], correct: "ие", hint: "сторонник свободы" },
            { word: "л.б.ральный", missing: [1, 3], correct: "ие", hint: "свободный, терпимый" },
            
            // М
            { word: "м.жор", missing: [1], correct: "а", hint: "музыкальный лад, выражающий бодрое, радостное настроение" },
            { word: "м.жорный", missing: [1], correct: "а", hint: "бодрый, радостный (о музыке)" },
            { word: "м.териал", missing: [1], correct: "а", hint: "вещество, исходник" },
            { word: "м.териальный", missing: [1], correct: "а", hint: "вещественный, реальный" },
            { word: "м.териализм", missing: [1], correct: "а", hint: "философское направление" },
            { word: "м.териализовать", missing: [1], correct: "а", hint: "воплощать в жизнь" },
            { word: "мгн.вение", missing: [3], correct: "о", hint: "очень короткий промежуток времени" },
            { word: "мгн.венный", missing: [3], correct: "о", hint: "очень быстрый, мгновенный" },
            { word: "м.нтал.тет", missing: [1, 6], correct: "еи", hint: "склад ума, мышления" },
            { word: "м.нтальный", missing: [1], correct: "е", hint: "относящийся к уму" },
            { word: "м.р.диан", missing: [1, 3], correct: "еа", hint: "линия долготы на глобусе" },
            { word: "м.роприятие", missing: [1], correct: "е", hint: "организованное действие" },
            { word: "м.тафора", missing: [1], correct: "е", hint: "образное выражение" },
            { word: "м.тафорический", missing: [1], correct: "е", hint: "образный, иносказательный" },
            { word: "м.ханизм", missing: [1], correct: "е", hint: "устройство, система" },
            { word: "м.ханический", missing: [1], correct: "е", hint: "действующий как механизм" },
            { word: "м.нерал", missing: [1], correct: "и", hint: "природное неорганическое вещество" },
            { word: "м.неральный", missing: [1], correct: "и", hint: "содержащий минералы" },
            { word: "м.нор", missing: [1], correct: "и", hint: "музыкальный лад, выражающий грустное, печальное настроение" },
            { word: "м.норный", missing: [1], correct: "и", hint: "грустный, печальный" },
            { word: "м.н.лит", missing: [1, 3], correct: "оо", hint: "единая каменная глыба" },
            { word: "м.н..литный", missing: [1, 3, 4], correct: "ооо", hint: "составляющий единое целое" },
            { word: "м.р.торий", missing: [1, 3], correct: "оа", hint: "временный запрет" },
            { word: "м.тив", missing: [1], correct: "о", hint: "причина, побуждение к действию" },
            { word: "м.тивировать", missing: [1], correct: "о", hint: "побуждать к действию" },
            { word: "м.тивация", missing: [1], correct: "о", hint: "побуждение к действию" },
            { word: "м.теж", missing: [1], correct: "я", hint: "восстание, бунт" },
            { word: "м.тежный", missing: [1], correct: "я", hint: "мятежный, бунтарский" }
        ];

        const LEVEL_NAMES = {
            1: "Новичок",
            2: "Знаток", 
            3: "Эксперт"
        };

        const LEVEL_SETTINGS = {
            1: { 
                speed: 1, 
                scoreMultiplier: 1, 
                snowdriftSpeed: 2, 
                snowdriftInterval: 2000,
                wordsPerLevel: 25,
                maxSnowdrifts: 15
            },
            2: { 
                speed: 1.3, 
                scoreMultiplier: 1.5, 
                snowdriftSpeed: 3, 
                snowdriftInterval: 1500,
                wordsPerLevel: 25,
                maxSnowdrifts: 20
            },
            3: { 
                speed: 1.6, 
                scoreMultiplier: 2, 
                snowdriftSpeed: 4, 
                snowdriftInterval: 1000,
                wordsPerLevel: 25,
                maxSnowdrifts: 25
            }
        };

        // Типы погоды
        const WEATHER_TYPES = {
            SUNNY: { name: "☀️ Солнечно", color: "#FFD700", speedMultiplier: 1.0, opacity: 0.3 },
            CLOUDY: { name: "☁️ Облачно", color: "#B0BEC5", speedMultiplier: 0.9, opacity: 0.6 },
            WINDY: { name: "💨 Ветрено", color: "#90CAF9", speedMultiplier: 1.2, opacity: 0.4 },
            SNOWY: { name: "❄️ Снегопад", color: "#E3F2FD", speedMultiplier: 1.1, opacity: 0.7 }
        };

        // Игровые переменные
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = 'playing';
        let score = 0;
        let lives = 3;
        let level = 1;
        let currentWordIndex = 0;
        let learnedWords = new Map();
        let correctInRow = 0;
        let combo = 0;
        let currentWord = null;
        let currentSelection = [];
        let currentMissingIndex = 0;
        let snowflakes = [];
        let particles = [];
        let player = { x: 0, y: 0, width: 80, height: 120, direction: 'right' };
        let snowdrifts = [];
        let animationId = null;
        let allWordsCompleted = false;
        let lastSnowdriftTime = 0;
        let confetti = [];
        let availableWords = [...ALL_WORDS];
        let currentSnowdriftId = null;
        let explodingSnowdrifts = [];
        
        // Погодные эффекты
        let clouds = [];
        let sunrays = [];
        let weatherParticles = [];
        let currentWeather = WEATHER_TYPES.SUNNY;
        let weatherChangeTime = 0;
        let weatherDuration = 30000; // 30 секунд на каждую погоду
        let soundEnabled = true;
        
        // Аудио контекст и генераторы звуков
        let audioContext;
        let masterGain;

        // Загружаемые изображения
        const images = {
            background: null,
            janitor_left: null,
            janitor_right: null,
            snowdrift: null,
            roof: null
        };

        // DOM элементы
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingText = document.getElementById('loadingText');
        const loadingFill = document.getElementById('loadingFill');
        const gameContainer = document.getElementById('gameContainer');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const wordsCountElement = document.getElementById('wordsCount');
        const levelElement = document.getElementById('level');
        const progressFill = document.getElementById('progressFill');
        const levelInfo = document.getElementById('levelInfo');
        const levelBadge = document.getElementById('levelBadge');
        const dictionaryWords = document.getElementById('dictionaryWords');
        const wordPopup = document.getElementById('wordPopup');
        const wordDisplay = document.getElementById('wordDisplay');
        const feedbackElement = document.getElementById('feedback');
        const keyboardHint = document.getElementById('keyboardHint');
        const soundToggle = document.getElementById('soundToggle');
        const weatherIndicator = document.getElementById('weatherIndicator');
        const celebration = document.getElementById('celebration');
        const celebrationTitle = document.getElementById('celebrationTitle');
        const celebrationSubtext = document.getElementById('celebrationSubtext');
        const celebrationStats = document.getElementById('celebrationStats');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const restartBtn = document.getElementById('restartBtn');
        const comboCounter = document.getElementById('comboCounter');

        // Инициализация звуковой системы
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.connect(audioContext.destination);
                masterGain.gain.value = soundEnabled ? 0.3 : 0;
                
                console.log("Аудио система инициализирована");
            } catch (e) {
                console.warn("Аудио не поддерживается:", e);
                soundEnabled = false;
                soundToggle.style.display = 'none';
            }
        }

        // Генерация звуков
        function playSound(type, frequency = 440, duration = 0.2, volume = 0.3) {
            if (!soundEnabled || !audioContext) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(masterGain);
                
                // Настройки в зависимости от типа звука
                switch(type) {
                    case 'correct':
                        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                        oscillator.frequency.exponentialRampToValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                        oscillator.type = 'sine';
                        break;
                    case 'wrong':
                        oscillator.frequency.setValueAtTime(392, audioContext.currentTime); // G4
                        oscillator.frequency.exponentialRampToValueAtTime(293.66, audioContext.currentTime + 0.15); // D4
                        oscillator.type = 'sawtooth';
                        break;
                    case 'collect':
                        oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime); // E5
                        oscillator.frequency.exponentialRampToValueAtTime(830.61, audioContext.currentTime + 0.1); // G#5
                        oscillator.type = 'triangle';
                        break;
                    case 'explode':
                        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
                        oscillator.type = 'square';
                        break;
                    case 'move':
                        oscillator.frequency.setValueAtTime(100, audioContext.currentTime);
                        oscillator.type = 'sine';
                        duration = 0.05;
                        break;
                    case 'levelup':
                        // Восходящая арпеджио
                        const times = [0, 0.1, 0.2, 0.3];
                        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                        times.forEach((time, i) => {
                            oscillator.frequency.setValueAtTime(freqs[i], audioContext.currentTime + time);
                        });
                        oscillator.type = 'sine';
                        break;
                }
                
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
                
            } catch (e) {
                console.warn("Не удалось воспроизвести звук:", e);
            }
        }

        // Обновление погодных эффектов
        function updateWeather() {
            const now = Date.now();
            
            // Смена погоды каждые 30 секунд
            if (now - weatherChangeTime > weatherDuration) {
                changeWeather();
            }
            
            // Обновляем облака
            clouds.forEach(cloud => {
                cloud.x += cloud.speed * currentWeather.speedMultiplier;
                if (cloud.x > canvas.width + cloud.width) {
                    cloud.x = -cloud.width;
                    cloud.y = Math.random() * canvas.height * 0.4;
                }
            });
            
            // Обновляем солнечные лучи
            sunrays.forEach(ray => {
                ray.angle += ray.speed;
            });
            
            // Обновляем погодные частицы
            for (let i = weatherParticles.length - 1; i >= 0; i--) {
                const particle = weatherParticles[i];
                
                if (currentWeather.name === "❄️ Снегопад") {
                    particle.y += particle.speed;
                    particle.x += Math.sin(particle.y * 0.01) * particle.sway;
                    
                    if (particle.y > canvas.height) {
                        weatherParticles.splice(i, 1);
                    }
                } else if (currentWeather.name === "💨 Ветрено") {
                    particle.x += particle.speed;
                    
                    if (particle.x > canvas.width + 50) {
                        weatherParticles.splice(i, 1);
                    }
                }
            }
            
            // Добавляем новые частицы для текущей погоды
            if (currentWeather.name === "❄️ Снегопад" && Math.random() < 0.1) {
                weatherParticles.push({
                    x: Math.random() * canvas.width,
                    y: -10,
                    size: 2 + Math.random() * 3,
                    speed: 1 + Math.random() * 2,
                    sway: 0.5 + Math.random() * 0.5,
                    opacity: 0.5 + Math.random() * 0.5
                });
            }
            
            if (currentWeather.name === "💨 Ветрено" && Math.random() < 0.05) {
                weatherParticles.push({
                    x: -20,
                    y: Math.random() * canvas.height * 0.7,
                    width: 30 + Math.random() * 20,
                    height: 2,
                    speed: 3 + Math.random() * 2,
                    opacity: 0.3 + Math.random() * 0.2,
                    color: '#90CAF9'
                });
            }
        }

        // Отрисовка погоды
        function drawWeather() {
            // Фоновое затемнение/осветление
            ctx.fillStyle = currentWeather.color;
            ctx.globalAlpha = currentWeather.opacity;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            
            // Солнечные лучи (только в солнечную погоду)
            if (currentWeather.name === "☀️ Солнечно") {
                const centerX = canvas.width * 0.8;
                const centerY = canvas.height * 0.2;
                
                sunrays.forEach(ray => {
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(ray.angle);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(ray.length, 0);
                    
                    ctx.strokeStyle = `rgba(255, 215, 0, ${ray.opacity})`;
                    ctx.lineWidth = ray.width;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    
                    ctx.restore();
                });
                
                // Солнце
                ctx.beginPath();
                ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700';
                ctx.fill();
            }
            
            // Облака
            clouds.forEach(cloud => {
                ctx.save();
                ctx.translate(cloud.x + cloud.width/2, cloud.y + cloud.height/2);
                
                ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
                
                // Рисуем облако из нескольких кругов
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    const offsetX = Math.cos(angle) * cloud.width * 0.3;
                    const offsetY = Math.sin(angle) * cloud.height * 0.3;
                    const radius = cloud.height * 0.4 + Math.random() * 10;
                    
                    ctx.beginPath();
                    ctx.arc(offsetX, offsetY, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            });
            
            // Погодные частицы
            weatherParticles.forEach(particle => {
                ctx.globalAlpha = particle.opacity;
                
                if (currentWeather.name === "❄️ Снегопад") {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (currentWeather.name === "💨 Ветрено") {
                    ctx.fillStyle = particle.color || '#90CAF9';
                    ctx.fillRect(particle.x, particle.y, particle.width, particle.height);
                }
                
                ctx.globalAlpha = 1;
            });
        }

        // Загрузка изображений
        function loadImages() {
            const imageFiles = [
                { key: 'background', src: 'winter_background.png' },
                { key: 'janitor_left', src: 'janitor_left.png' },
                { key: 'janitor_right', src: 'janitor_right.png' },
                { key: 'snowdrift', src: 'snowdrift.png' },
                { key: 'roof', src: 'roof.png' }
            ];

            let loadedCount = 0;
            const totalCount = imageFiles.length;

            imageFiles.forEach((file) => {
                const img = new Image();
                img.onload = () => {

                    loadingFill.style.width = `${progress}%`;
                    loadingText.textContent = `Загружено: ${loadedCount}/${totalCount} изображений`;
                    
                    if (loadedCount === totalCount) {

                                gameContainer.style.display = 'block';
                                initGame();

                        }, 500);
                    }
                };

                    loadedCount++;
                    
                    const progress = Math.round((loadedCount / totalCount) * 100);
                    loadingFill.style.width = `${progress}%`;
                    
                    if (loadedCount === totalCount) {

                            loadingScreen.style.opacity = '0';

                                loadingScreen.style.display = 'none';
                                gameContainer.style.display = 'block';

        // Проверка мобильного устройства
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Создание сугроба
        function createSnowdrift(isFirst = false) {
            if (gameState !== 'playing') return;
            
            const now = Date.now();
            const settings = LEVEL_SETTINGS[level];
            
            if (!isFirst && now - lastSnowdriftTime < settings.snowdriftInterval) return;
            
            // Проверяем вертикальное переполнение
            if (checkVerticalOverflow()) {
                gameOver();
                return;
            }
            
            // Получаем слово
            let wordData;
            if (level === 1) {
                // На первом уровне - новые слова без повторений
                if (learnedWords.size >= settings.wordsPerLevel) {
                    return; // Все слова изучены
                }
                
                // Берем следующее слово из перемешанного списка
                wordData = availableWords[currentWordIndex];
                currentWordIndex = (currentWordIndex + 1) % availableWords.length;
            } else {
                // На остальных уровнях - перемешанные слова
                wordData = availableWords[Math.floor(Math.random() * availableWords.length)];
            }
            
            // Находим свободное место для нового сугроба
            let x, y, attempts = 0;
            do {
                x = 50 + Math.random() * (canvas.width - 100);
                
                // Находим максимальную высоту сугроба в этом столбце
                let maxY = canvas.height - 150; // Начальная высота (земля)
                
                for (const snowdrift of snowdrifts) {
                    if (Math.abs(snowdrift.x - x) < 60) { // Проверяем столбцы шириной 60px
                        maxY = Math.min(maxY, snowdrift.y - 10); // Ставим выше предыдущего
                    }
                }
                
                // Первые сугробы падают чуть ниже уровня персонажа
                if (isFirst) {
                    y = player.y + player.height + 20; // Чуть ниже персонажа
                } else {
                    y = maxY - 70; // Отступаем вверх
                }
                
                attempts++;
                
                if (attempts > 100) {
                    y = -100; // Если не нашли место, падаем сверху
                    break;
                }
            } while (y < -100); // Не выше чем -100
            
            const snowdrift = {
                x: x,
                y: y,
                width: 70,
                height: 50,
                word: wordData,
                speed: settings.snowdriftSpeed * (0.8 + Math.random() * 0.4) * currentWeather.speedMultiplier,
                collected: false,
                onGround: isFirst, // Первые сугробы сразу на земле
                id: Date.now(),
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.05,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.03 + Math.random() * 0.02,
                targetY: canvas.height - 150, // Целевая позиция на земле
                column: Math.floor(x / 60) // Столбец для группировки
            };
            
            // Если есть сугроб в этом столбце, корректируем targetY
            for (const other of snowdrifts) {
                if (Math.abs(other.x - x) < 60 && other.onGround) {
                    snowdrift.targetY = other.y - 10;
                }
            }
            
            // Если это первый сугроб, он сразу на земле
            if (isFirst) {
                snowdrift.y = snowdrift.targetY;
                snowdrift.onGround = true;
            }
            
            snowdrifts.push(snowdrift);
            lastSnowdriftTime = now;
            
            // Звук падения сугроба
            if (!isFirst) {
                playSound('collect', 200, 0.1, 0.1);
            }
        }

        // Проверка вертикального переполнения
        function checkVerticalOverflow() {
            // Проверяем, есть ли сугробы, которые достигли верха экрана
            for (const snowdrift of snowdrifts) {
                if (snowdrift.y < 50) { // Если сугроб выше 50px от верха
                    return true;
                }
            }
            return false;
        }

        // Инициализация снежинок
        function initSnowflakes() {
            snowflakes = [];
            for (let i = 0; i < 80; i++) {
                snowflakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 1 + 0.5 * currentWeather.speedMultiplier,
                    sway: 0.3 + Math.random() * 0.3,
                    opacity: 0.3 + Math.random() * 0.3
                });
            }
        }

        // Обновление игры
        function updateGame() {
            if (gameState !== 'playing') return;
            
            updateSnowflakes();
            updateSnowdrifts();
            updateExplodingSnowdrifts();
            updateParticles();
            updateConfetti();
            updateWeather();
            
            const now = Date.now();
            if (now - lastSnowdriftTime > LEVEL_SETTINGS[level].snowdriftInterval) {
                createSnowdrift();
            }
        }

        // Обновление снежинок
        function updateSnowflakes() {
            snowflakes.forEach(flake => {
                flake.y += flake.speed;
                flake.x += Math.sin(flake.y * 0.01) * flake.sway * currentWeather.speedMultiplier;
                
                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }
            });
        }

        // Обновление сугробов
        function updateSnowdrifts() {
            for (let i = snowdrifts.length - 1; i >= 0; i--) {
                const snowdrift = snowdrifts[i];
                
                if (!snowdrift.onGround) {
                    // Анимация падения
                    snowdrift.y += snowdrift.speed;
                    snowdrift.rotation += snowdrift.rotationSpeed;
                    snowdrift.wobble += snowdrift.wobbleSpeed;
                    
                    // Небольшое качание при падении
                    snowdrift.x += Math.sin(snowdrift.wobble) * 0.5 * currentWeather.speedMultiplier;
                    
                    if (snowdrift.y >= snowdrift.targetY) {
                        snowdrift.y = snowdrift.targetY;
                        snowdrift.onGround = true;
                        snowdrift.speed = 0;
                        snowdrift.rotationSpeed = 0;
                        snowdrift.wobbleSpeed = 0.01; // Медленное качание на земле
                    }
                    
                    if (checkCollision(player, snowdrift)) {
                        startWordGame(snowdrift);
                    }
                } else {
                    // Качание на земле
                    snowdrift.wobble += snowdrift.wobbleSpeed;
                    snowdrift.x += Math.sin(snowdrift.wobble) * 0.1;
                    
                    // Ограничиваем движение по земле
                    if (snowdrift.x < 50) snowdrift.x = 50;
                    if (snowdrift.x > canvas.width - 50 - snowdrift.width) snowdrift.x = canvas.width - 50 - snowdrift.width;
                    
                    if (checkCollision(player, snowdrift)) {
                        startWordGame(snowdrift);
                    }
                }
            }
        }

        // Падение верхних сугробов при удалении нижнего
        function fallSnowdriftsAbove(deletedSnowdrift) {
            for (let i = 0; i < snowdrifts.length; i++) {
                const snowdrift = snowdrifts[i];
                if (Math.abs(snowdrift.x - deletedSnowdrift.x) < 60 && 
                    snowdrift.y < deletedSnowdrift.y) {
                    // Сугроб находится в том же столбце и выше удаленного
                    snowdrift.targetY = deletedSnowdrift.y;
                    snowdrift.onGround = false;
                    snowdrift.speed = LEVEL_SETTINGS[level].snowdriftSpeed * 0.5 * currentWeather.speedMultiplier;
                }
            }
        }

        // Обновление разлетающихся сугробов
        function updateExplodingSnowdrifts() {
            for (let i = explodingSnowdrifts.length - 1; i >= 0; i--) {
                const particle = explodingSnowdrifts[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                particle.vy += 0.1; // Гравитация
                
                if (particle.life <= 0) {
                    explodingSnowdrifts.splice(i, 1);
                }
            }
        }

        // Анимация разлета сугроба
        function explodeSnowdrift(snowdrift) {
            // Создаем частицы для разлета
            for (let i = 0; i < 15; i++) {
                explodingSnowdrifts.push({
                    x: snowdrift.x + snowdrift.width/2,
                    y: snowdrift.y + snowdrift.height/2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 4,
                    life: 1,
                    width: snowdrift.width * 0.3,
                    height: snowdrift.height * 0.3,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            
            // Звук взрыва
            playSound('explode', 100, 0.3, 0.2);
        }

        // Проверка столкновения
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Начало мини-игры со словом
        function startWordGame(snowdrift) {
            if (currentWord !== null) return;
            
            currentWord = snowdrift.word;
            currentSnowdriftId = snowdrift.id;
            currentSelection = new Array(currentWord.correct.length).fill(null);
            currentMissingIndex = 0;
            
            // Звук столкновения
            playSound('collect', 300, 0.1, 0.2);
            
            showWordPopup();
        }

        // Показ попапа со словом
        function showWordPopup() {
            wordPopup.style.display = 'block';
            updateWordDisplay();
        }

        // Скрытие попапа
        function hideWordPopup() {
            wordPopup.style.display = 'none';
            feedbackElement.textContent = '';
            feedbackElement.className = '';
            currentWord = null;
            currentSnowdriftId = null;
        }

        // Обновление отображения слова
        function updateWordDisplay() {
            if (!currentWord) return;
            
            let display = '';
            let missingIndex = 0;
            
            for (let i = 0; i < currentWord.word.length; i++) {
                if (currentWord.missing.includes(i)) {
                    const userLetter = currentSelection[missingIndex];
                    if (userLetter) {
                        const correctLetter = currentWord.correct[missingIndex];
                        if (userLetter === correctLetter) {
                            display += `<span style="color: #4CAF50; font-weight: bold;">${userLetter}</span>`;
                        } else {
                            display += `<span style="color: #FF5252; font-weight: bold;">${userLetter}</span>`;
                        }
                    } else {
                        display += '<span style="color: #2196F3; font-weight: bold;">_</span>';
                    }
                    missingIndex++;
                } else {
                    display += currentWord.word[i];
                }
            }
            
            wordDisplay.innerHTML = display;
        }

        // Выбор буквы
        function selectLetter(letter) {
            if (!currentWord || currentMissingIndex >= currentWord.correct.length) return;
            
            currentSelection[currentMissingIndex] = letter;
            updateWordDisplay();
            
            const correctLetter = currentWord.correct[currentMissingIndex];
            const isCorrect = letter === correctLetter;
            
            if (isCorrect) {
                feedbackElement.textContent = '✓ Правильно!';
                feedbackElement.className = 'correct';
                createParticles('#4CAF50', canvas.width/2, canvas.height/2);
                createWordCompleted('✓', '#4CAF50');
                playSound('correct', 523.25, 0.2, 0.3);
                
                currentMissingIndex++;
                
                if (currentMissingIndex >= currentWord.correct.length) {
                    completeWord(true);
                    return;
                }
            } else {
                feedbackElement.textContent = '✗ Неправильно';
                feedbackElement.className = 'wrong';
                createParticles('#FF5252', canvas.width/2, canvas.height/2);
                createWordCompleted('✗', '#FF5252');
                playSound('wrong', 392, 0.2, 0.3);
                loseLife();
                combo = 0;
                updateCombo();
                
                currentMissingIndex++;
                
                if (currentMissingIndex >= currentWord.correct.length) {
                    completeWord(false);
                    return;
                }
            }
        }

        // Завершение слова
        function completeWord(isCorrect) {
            const wordKey = currentWord.word;
            const fullWord = getFullWord(currentWord);
            
            if (isCorrect) {
                let wordScore = 100 * LEVEL_SETTINGS[level].scoreMultiplier;
                
                if (combo > 0) {
                    wordScore += combo * 25;
                }
                
                score += wordScore;
                correctInRow++;
                combo++;
                
                if (!learnedWords.has(wordKey)) {
                    learnedWords.set(wordKey, {
                        word: fullWord,
                        hint: currentWord.hint
                    });
                    updateDictionary();
                }
                
                createParticles('#FFD700', canvas.width/2, canvas.height/2);
                createConfetti();
                playSound('levelup', 440, 0.5, 0.2);
                
                // Находим и удаляем сугроб с анимацией разлета
                const index = snowdrifts.findIndex(s => s.id === currentSnowdriftId);
                if (index > -1) {
                    const snowdrift = snowdrifts[index];
                    explodeSnowdrift(snowdrift);
                    fallSnowdriftsAbove(snowdrift); // Верхние сугробы падают вниз
                    snowdrifts.splice(index, 1);
                }
                
                // Проверяем, изучены ли все слова для текущего уровня
                if (level === 1 && learnedWords.size >= LEVEL_SETTINGS[level].wordsPerLevel) {
                    allWordsCompleted = true;
                    setTimeout(() => showCelebration(true), 1000);
                }
            } else {
                correctInRow = 0;
                combo = 0;
                createParticles('#FF5252', canvas.width/2, canvas.height/2);
            }
            
            updateUI();
            updateProgress();
            updateCombo();
            
            setTimeout(() => {
                hideWordPopup();
            }, 1000);
        }

        // Потеря жизни
        function loseLife() {
            lives--;
            
            if (lives <= 0) {
                gameOver();
            }
            
            updateUI();
            createParticles('#FF5252', player.x + player.width/2, player.y + player.height/2);
        }

        // Конец игры
        function gameOver() {
            gameState = 'gameOver';
            showCelebration(false);
        }

        // Получение полного слова
        function getFullWord(wordData) {
            let result = '';
            let missingIndex = 0;
            
            for (let i = 0; i < wordData.word.length; i++) {
                if (wordData.missing.includes(i)) {
                    result += wordData.correct[missingIndex];
                    missingIndex++;
                } else {
                    result += wordData.word[i];
                }
            }
            
            return result;
        }

        // Показ экрана поздравления
        function showCelebration(isVictory) {
            if (isVictory) {
                celebrationTitle.textContent = '🎉 ВСЕ СЛОВА ИЗУЧЕНЫ! 🎉';
                celebrationSubtext.textContent = getRandomPraise();
                
                const statsHTML = `
                    <div style="text-align: center; margin: 30px 0; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; max-width: 500px;">
                        <div style="font-size: 24px; color: #FFD700; margin: 10px 0;">
                            Уровень "${LEVEL_NAMES[level]}" завершён!
                        </div>
                        <div style="font-size: 18px; color: #4CAF50; margin: 10px 0;">
                            📚 Изучено слов: ${learnedWords.size}/${LEVEL_SETTINGS[level].wordsPerLevel}
                        </div>
                        <div style="font-size: 18px; color: #2196F3; margin: 10px 0;">
                            🎯 Точность: ${Math.round((learnedWords.size / (learnedWords.size + (3 - lives))) * 100)}%
                        </div>
                        <div style="font-size: 18px; color: #FF9800; margin: 10px 0;">
                            ⭐ Счёт: ${score}
                        </div>
                        <div style="font-size: 16px; color: #aaa; margin-top: 15px;">
                            Следующий уровень: сугробы падают быстрее!
                        </div>
                    </div>
                `;
                
                celebrationStats.innerHTML = statsHTML;
                
                if (level < 3) {
                    nextLevelBtn.style.display = 'block';
                    nextLevelBtn.textContent = `🚀 УРОВЕНЬ ${level+1}: ${LEVEL_NAMES[level+1].toUpperCase()}`;
                } else {
                    nextLevelBtn.style.display = 'none';
                    celebrationSubtext.textContent = 'Вы достигли максимального уровня! Вы — настоящий мастер русского языка!';
                    celebrationTitle.innerHTML = '👑 ПОБЕДА! ВЫ СТАЛИ ГЕНИЕМ РУССКОГО ЯЗЫКА! 👑';
                }
            } else {
                celebrationTitle.textContent = '❄️ ИГРА ОКОНЧЕНА ❄️';
                celebrationSubtext.textContent = 'Сугробы заполнили весь экран!';
                nextLevelBtn.style.display = 'none';
                
                const statsHTML = `
                    <div style="text-align: center; margin: 30px 0; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; max-width: 500px;">
                        <div style="font-size: 24px; color: #FFD700; margin: 10px 0;">
                            Итоговый счёт: ${score}
                        </div>
                        <div style="font-size: 18px; color: #4CAF50; margin: 10px 0;">
                            📚 Изучено слов: ${learnedWords.size}
                        </div>
                        <div style="font-size: 18px; color: #2196F3; margin: 10px 0;">
                            🎯 Точность: ${Math.round((learnedWords.size / (learnedWords.size + (3 - lives))) * 100)}%
                        </div>
                        <div style="font-size: 18px; color: #FF9800; margin: 10px 0;">
                            🏆 Уровень: ${LEVEL_NAMES[level]}
                        </div>
                    </div>
                `;
                
                celebrationStats.innerHTML = statsHTML;
            }
            
            celebration.style.display = 'flex';
            createMassiveConfetti();
        }

        // Случайные похвалы
        function getRandomPraise() {
            const praises = [
                'Блестящий результат! Ваш словарный запас впечатляет!',
                'Потрясающе! Вы настоящий знаток русского языка!',
                'Великолепно! Каждое слово — как родное!',
                'Фантастика! Вы справились идеально!',
                'Изумительно! Русский язык — ваша стихия!'
            ];
            
            return praises[Math.floor(Math.random() * praises.length)];
        }

        // Переход на следующий уровень
        function nextLevel() {
            level++;
            allWordsCompleted = false;
            availableWords = [...ALL_WORDS].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            correctInRow = 0;
            combo = 0;
            snowdrifts = [];
            explodingSnowdrifts = [];
            
            celebration.style.display = 'none';
            gameState = 'playing';
            
            updateUI();
            updateProgress();
            updateCombo();
            
            createLevelTransition();
            
            setTimeout(() => createSnowdrift(true), 500);
            setTimeout(() => createSnowdrift(true), 1500);
            setTimeout(() => createSnowdrift(true), 2500);
        }

        // Эффект перехода уровня
        function createLevelTransition() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createParticles('#FFD700', canvas.width/2, canvas.height/2);
                }, i * 20);
            }
            
            levelBadge.style.animation = 'none';
            setTimeout(() => {
                levelBadge.style.animation = 'pulse 2s infinite';
            }, 100);
            
            playSound('levelup', 523.25, 1, 0.3);
        }

        // Создание частиц
        function createParticles(color, x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x || canvas.width/2,
                    y: y || canvas.height/2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 4,
                    life: 1,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // Создание конфетти
        function createConfetti() {
            const colors = ['#FF4081', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#FFD700'];
            for (let i = 0; i < 20; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    width: Math.random() * 8 + 4,
                    height: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 8
                });
            }
        }

        // Массивное конфетти для победы
        function createMassiveConfetti() {
            const colors = ['#FF4081', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#FFD700'];
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    confetti.push({
                        x: Math.random() * canvas.width,
                        y: -20,
                        width: Math.random() * 12 + 4,
                        height: Math.random() * 12 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        speed: Math.random() * 6 + 3,
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 12
                    });
                }, i * 15);
            }
        }

        // Обновление конфетти
        function updateConfetti() {
            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.y += c.speed;
                c.rotation += c.rotationSpeed;
                
                if (c.y > canvas.height + 50) {
                    confetti.splice(i, 1);
                }
            }
        }

        // Обновление частиц
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.vy += 0.2;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // Создание анимации завершения слова
        function createWordCompleted(text, color) {
            const element = document.createElement('div');
            element.className = 'word-completed';
            element.textContent = text;
            element.style.color = color;
            element.style.left = '50%';
            element.style.top = '50%';
            element.style.transform = 'translate(-50%, -50%)';
            
            document.getElementById('gameContainer').appendChild(element);
            
            setTimeout(() => {
                element.remove();
            }, 2000);
        }

        // Отрисовка игры
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка фона
            if (images.background) {
                // Рисуем фон на весь экран
                ctx.drawImage(images.background, 0, 0, canvas.width, canvas.height);
            } else {
                // Запасной вариант - градиент
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#1a237e');
                gradient.addColorStop(0.5, '#283593');
                gradient.addColorStop(1, '#3949ab');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Погодные эффекты
            drawWeather();
            
            // Крыша (если загружена)
            if (images.roof) {
                const roofAspectRatio = 1.5;
                const roofWidth = canvas.width * 0.7;
                const roofHeight = roofWidth / roofAspectRatio;
                const roofX = canvas.width/2 - roofWidth/2;
                const roofY = canvas.height - roofHeight - 50;
                ctx.globalAlpha = 0.8; // Полупрозрачная крыша
                ctx.drawImage(images.roof, roofX, roofY, roofWidth, roofHeight);
                ctx.globalAlpha = 1;
            }
            
            // Снежинки
            snowflakes.forEach(flake => {
                ctx.globalAlpha = flake.opacity;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Земля (снег)
            ctx.fillStyle = '#E3F2FD';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Игрок (дворник)
            let playerImage = player.direction === 'left' ? images.janitor_left : images.janitor_right;
            if (playerImage) {
                const walkOffset = Math.sin(Date.now() * 0.005) * 3;
                ctx.drawImage(playerImage, player.x, player.y + walkOffset, player.width, player.height);
            } else {
                // Запасной вариант
                ctx.fillStyle = player.direction === 'left' ? '#FF5722' : '#FF9800';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
            
            // Разлетающиеся сугробы
            explodingSnowdrifts.forEach(particle => {
                ctx.save();
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.rotation * Math.PI / 180);
                ctx.globalAlpha = particle.life;
                
                if (images.snowdrift) {
                    ctx.drawImage(
                        images.snowdrift,
                        -particle.width/2,
                        -particle.height/2,
                        particle.width,
                        particle.height
                    );
                } else {
                    // Запасной вариант
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-particle.width/2, -particle.height/2, particle.width, particle.height);
                }
                
                ctx.restore();
            });
            ctx.globalAlpha = 1;
            
            // Сугробы
            snowdrifts.forEach(snowdrift => {
                if (images.snowdrift) {
                    ctx.save();
                    ctx.translate(snowdrift.x + snowdrift.width/2, snowdrift.y + snowdrift.height/2);
                    ctx.rotate(snowdrift.rotation);
                    
                    ctx.drawImage(
                        images.snowdrift, 
                        -snowdrift.width/2, 
                        -snowdrift.height/2, 
                        snowdrift.width, 
                        snowdrift.height
                    );
                    
                    ctx.restore();
                } else {
                    // Запасной вариант
                    ctx.save();
                    ctx.translate(snowdrift.x + snowdrift.width/2, snowdrift.y + snowdrift.height/2);
                    ctx.rotate(snowdrift.rotation);
                    
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, snowdrift.width/2);
                    gradient.addColorStop(0, '#FFFFFF');
                    gradient.addColorStop(1, '#E3F2FD');
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, snowdrift.width/2, snowdrift.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            });
            
            // Конфетти
            confetti.forEach(c => {
                ctx.save();
                ctx.translate(c.x + c.width/2, c.y + c.height/2);
                ctx.rotate(c.rotation * Math.PI / 180);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.width/2, -c.height/2, c.width, c.height);
                ctx.restore();
            });
            
            // Частицы
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Обновление UI
        function updateUI() {
            scoreElement.textContent = score;
            livesElement.textContent = '❤️'.repeat(Math.max(0, lives));
            
            wordsCountElement.textContent = `${learnedWords.size}/${LEVEL_SETTINGS[level].wordsPerLevel}`;
            levelElement.textContent = level;
            
            levelInfo.textContent = `Сложность: ${LEVEL_NAMES[level]}`;
            levelBadge.textContent = LEVEL_NAMES[level];
            
            const colors = ['#4CAF50', '#2196F3', '#FF9800'];
            levelBadge.style.background = `linear-gradient(45deg, ${colors[level-1]}, ${colors[level % colors.length]})`;
        }

        // Обновление прогресса
        function updateProgress() {
            const progress = LEVEL_SETTINGS[level].wordsPerLevel > 0 ? 
                (learnedWords.size / LEVEL_SETTINGS[level].wordsPerLevel) * 100 : 0;
            progressFill.style.width = `${progress}%`;
        }

        // Обновление комбо
        function updateCombo() {
            if (combo > 1) {
                comboCounter.textContent = `Комбо: ${combo} × ${25 * combo} бонус`;
                comboCounter.style.display = 'block';
                
                comboCounter.style.animation = 'none';
                setTimeout(() => {
                    comboCounter.style.animation = 'pulse 0.5s';
                }, 10);
            } else {
                comboCounter.style.display = 'none';
            }
        }

        // Обновление словарика
        function updateDictionary() {
            dictionaryWords.innerHTML = '';
            
            if (learnedWords.size === 0) {
                dictionaryWords.innerHTML = '<div style="color: #aaa; font-style: italic;">Изученных слов пока нет</div>';
                return;
            }
            
            // Сортируем слова по алфавиту
            const sortedWords = Array.from(learnedWords.entries()).sort((a, b) => 
                a[1].word.localeCompare(b[1].word)
            );
            
            sortedWords.forEach(([key, wordData]) => {
                const wordElement = document.createElement('div');
                wordElement.className = 'dictionary-word';
                wordElement.innerHTML = `
                    <strong>${wordData.word}</strong><br>
                    <small style="color: #aaa;">${wordData.hint}</small>
                `;
                dictionaryWords.appendChild(wordElement);
            });
        }

        // Игровой цикл
        function gameLoop() {
            updateGame();
            drawGame();
            animationId = requestAnimationFrame(gameLoop);
        }

        // Изменение размера canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 150;
        }

        // Управление игроком
        let touchStartX = 0;
        let isDragging = false;
        let lastPlayerMove = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            isDragging = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || gameState !== 'playing') return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            touchStartX = touch.clientX;
            
            player.x += deltaX * 1.5;
            
            // Звук движения
            if (Date.now() - lastPlayerMove > 200) {
                playSound('move', 100, 0.05, 0.1);
                lastPlayerMove = Date.now();
            }
            
            // Обновляем направление игрока
            if (deltaX > 0) {
                player.direction = 'right';
            } else if (deltaX < 0) {
                player.direction = 'left';
            }
            
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (gameState === 'playing') {
                // Управление дворником
                const speed = 20;
                
                switch(e.key) {
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        player.x = Math.max(0, player.x - speed);
                        player.direction = 'left';
                        if (Date.now() - lastPlayerMove > 200) {
                            playSound('move', 100, 0.05, 0.1);
                            lastPlayerMove = Date.now();
                        }
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        player.x = Math.min(canvas.width - player.width, player.x + speed);
                        player.direction = 'right';
                        if (Date.now() - lastPlayerMove > 200) {
                            playSound('move', 100, 0.05, 0.1);
                            lastPlayerMove = Date.now();
                        }
                        break;
                }
            }
            
            if (currentWord !== null) {
                // Ввод букв с клавиатуры в мини-игре
                const key = e.key.toLowerCase();
                const russianLetters = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';
                
                if (russianLetters.includes(key)) {
                    selectLetter(key);
                    e.preventDefault();
                } else if (e.key === 'Backspace') {
                    // Удаление последней буквы
                    if (currentMissingIndex > 0) {
                        currentMissingIndex--;
                        currentSelection[currentMissingIndex] = null;
                        updateWordDisplay();
                    }
                    e.preventDefault();
                } else if (e.key === 'Enter') {
                    // Завершение слова досрочно
                    if (currentMissingIndex >= currentWord.correct.length) {
                        completeWord(true);
                    }
                    e.preventDefault();
                }
            }
        });

        // Обработчики кнопок
        nextLevelBtn.addEventListener('click', nextLevel);
        restartBtn.addEventListener('click', () => {
            celebration.style.display = 'none';
            gameState = 'playing';
            level = 1;
            initGame();
        });

        // Переключение звука
        soundToggle.addEventListener('click', toggleSound);

        // Обработка изменения размера окна
        window.addEventListener('resize', resizeCanvas);

        // Запуск игры при загрузке страницы
        window.addEventListener('load', () => {
            loadImages();
        });
    </script>
</body>
</html>
